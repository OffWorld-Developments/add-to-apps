name: Feature request
description: Suggest an improvement to the one-click workflow.
title: "Idea: "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current behavior gets in the way.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested behavior
      description: How could this work while keeping the ordinary Add action simple?
    validations:
      required: true
