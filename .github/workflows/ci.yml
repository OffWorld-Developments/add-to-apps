name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-gnome:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install latest stable GNOME libraries and test tools
        run: >-
          pacman -Syu --noconfirm --needed git python python-gobject python-cairo
          nautilus nautilus-python gtk4 libadwaita desktop-file-utils
          python-pytest ruff dbus xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test as an unprivileged user
        run: |
          useradd --create-home tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
          runuser -u tester -- python3 tools/install.py --check
          runuser -u tester -- python3 -m pytest -q
      - name: Build source archive
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 tools/package.py --tag "$GITHUB_REF_NAME"
          else
            python3 tools/package.py
          fi
      - name: Save release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-release
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
