[project]
name = "add-to-applications"
version = "0.1.0"
description = "One-click application launchers from GNOME Files"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
